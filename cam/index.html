<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cam</title>
</head>

<body>
    <img id="jpeg_0" width="1280" height="720">

    <!-- El token es carrega des d'un fitxer local NO versionat (cam/token.js).
         Si no existeix, el navegador el reporta com a 404 i es fa servir el
         valor de reserva de sota. -->
    <script src="token.js"></script>

    <script type="text/javascript">
        var camera_0 = {
            addEvent: function(elem, event, func ){
                if (typeof (window.event) != 'undefined')
                    {elem.attachEvent('on' + event, func);}
                else
                    {elem.addEventListener(event, func, false);}
            },
            initCamera: function(jpeg, serverUrl, token, id, interval){
              this.addEvent(jpeg, 'load', function(){setTimeout(function() {camera_0.showJpegFrame(jpeg, serverUrl, token, id);}, interval);});
              this.showJpegFrame(jpeg, serverUrl, token, id);
            },
            showJpegFrame: function(jpeg, serverUrl, token, id){
                jpeg.src = serverUrl+"/Jpeg/"+id+"?authToken="+token+"&"+new Date().getTime();
            }
        }

      // El token d'autenticació de la càmera NO es versiona: es llegeix del
      // fitxer local `cam/token.js` (ignorat per Git i exclòs del deploy).
      // Crea'l amb:  window.cameraToken = "el-teu-token";
      window.cameraToken = window.cameraToken || "REPLACE_WITH_YOUR_CAMERA_TOKEN";
      camera_0.initCamera(jpeg_0, "http://127.0.0.1:8100", window.cameraToken, 0, 40);
    </script>
    

</body>

</html>
